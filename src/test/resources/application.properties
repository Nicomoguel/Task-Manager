#specifies to use the h2 driver to connect to the h2 database
spring.datasource.driver-class-name=org.h2.Driver

#url, h2 in memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=sa

#create the schema when we run the tests and then drop it at the end
spring.jpa.hibernate.ddl-auto=create-drop

#specify to use the H2 dialect
spring.dpa.database-platform=org.hibernate.dialect.H2Dialect